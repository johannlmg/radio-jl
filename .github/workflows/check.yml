name: Vérifier les flux
on:
  push:
    paths: ["tools/**", ".github/workflows/check.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/*.json
          git commit -m "Résultats du test des flux" || exit 0
          git push
